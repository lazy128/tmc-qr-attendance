spring.profiles.default=workplace
spring.datasource.url=jdbc:h2:file:./data/tmc-edge
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.task.scheduling.pool.size=4
server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
tmc.cors.origins=${TMC_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
tmc.qr.ttl-seconds=30
tmc.qr.personal-link-ttl-seconds=60
tmc.checkin.personal-self.enabled=false
tmc.checkin.personal-self.max-per-day=4
tmc.attendance.pairs-per-day=1
tmc.clock.skew-seconds=5
tmc.edge.snapshot-max-age-seconds=900
tmc.turnstile.timeout-millis=800
tmc.turnstile.reconciliation-seconds=120
tmc.central.url=http://localhost:8090
tmc.idempotency.reservation-ttl-seconds=60
