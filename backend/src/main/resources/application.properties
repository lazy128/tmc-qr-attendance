spring.datasource.url=jdbc:h2:file:./data/tmc-edge
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.task.scheduling.pool.size=4
server.port=8080
server.address=127.0.0.1
tmc.qr.ttl-seconds=30
tmc.clock.skew-seconds=5
tmc.edge.snapshot-max-age-seconds=900
tmc.turnstile.timeout-millis=800
tmc.central.url=http://localhost:8090
tmc.idempotency.reservation-ttl-seconds=60
