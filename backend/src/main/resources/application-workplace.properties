server.port=8084
spring.datasource.url=jdbc:h2:file:./data/tmc-workplace
spring.datasource.username=${TMC_DB_USERNAME:sa}
spring.datasource.password=${TMC_DB_PASSWORD:}
tmc.accounts.enabled=true
tmc.workflow.demo=false
tmc.edge.site=SITE-BD
tmc.edge.station=BD-G01
tmc.qr.signing-kid=workplace
tmc.qr.ttl-seconds=180
tmc.timesheet.export-dir=exports/workplace
tmc.accounts.cookie-secure=${TMC_SESSION_SECURE:true}
tmc.accounts.trust-loopback-proxy=${TMC_TRUST_LOOPBACK_PROXY:false}
management.endpoints.web.exposure.include=health
